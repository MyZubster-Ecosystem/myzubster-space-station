version: '3.8'

services:
  station-core:
    build:
      context: ./station-core
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/myzubster-space
      - DEBUG=true
    depends_on:
      - mongodb
    volumes:
      - ./station-core:/app
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CORE_URL=http://station-core:8000
    depends_on:
      - station-core
    restart: unless-stopped

volumes:
  mongodb_data:
