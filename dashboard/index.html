<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🚀 MyZubster Space Station</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-white min-h-screen">
<div class="max-w-6xl mx-auto p-6">
<header class="border border-cyan-900 bg-slate-900 rounded-2xl p-6 mb-6"><h1 class="text-3xl font-bold text-cyan-400">🚀 MyZubster Space Station</h1><p class="text-slate-400">Real-time monitoring & control system</p><p id="status" class="mt-3 text-yellow-400">Connecting...</p></header>
<div class="grid md:grid-cols-3 gap-4 mb-6"><div class="bg-slate-900 rounded-xl p-5"><div class="text-slate-400">🤖 Robots</div><div id="robotsCount" class="text-3xl font-bold">-</div></div><div class="bg-slate-900 rounded-xl p-5"><div class="text-slate-400">🚀 Missions</div><div id="missionsCount" class="text-3xl font-bold">-</div></div><div class="bg-slate-900 rounded-xl p-5"><div class="text-slate-400">📡 Telemetry</div><div id="telemetryCount" class="text-3xl font-bold">-</div></div></div>
<div class="grid md:grid-cols-2 gap-6"><section class="bg-slate-900 rounded-xl p-5"><h2 class="font-bold text-xl mb-4">Robots</h2><div id="robots" class="space-y-3"></div></section><section class="bg-slate-900 rounded-xl p-5"><div class="flex justify-between"><h2 class="font-bold text-xl">Missions</h2><button onclick="createMission()" class="bg-cyan-600 px-3 py-2 rounded-lg">+ Mission</button></div><div id="missions" class="space-y-3 mt-4"></div></section></div>
</div>
<script>
const API_URL='';
async function load(){try{const [hr,rr,mr,tr]=await Promise.all([fetch('/api/health'),fetch('/api/robots'),fetch('/api/missions'),fetch('/api/telemetry')]);if(!hr.ok)throw new Error('API '+hr.status);const h=await hr.json(),robots=await rr.json(),missions=await mr.json(),telemetry=await tr.json();document.getElementById('status').textContent='● '+h.status+' · v'+h.version;document.getElementById('status').className='mt-3 text-green-400';robotsCount.textContent=robots.length;missionsCount.textContent=missions.length;telemetryCount.textContent=telemetry.length;document.getElementById('robots').innerHTML=robots.map(r=>`<div class="bg-slate-800 p-3 rounded-lg"><b>${r.name||r.robot_id}</b><div class="text-slate-400">${r.status} · 🔋 ${r.battery}% · ${r.location}</div></div>`).join('')||'<span class="text-slate-500">No robots</span>';document.getElementById('missions').innerHTML=missions.slice(-8).reverse().map(m=>`<div class="bg-slate-800 p-3 rounded-lg"><b>${m.type}</b> → ${m.target}<div class="text-slate-400">${m.status}</div></div>`).join('')||'<span class="text-slate-500">No missions yet</span>';}catch(e){document.getElementById('status').textContent='● API unavailable: '+e.message;document.getElementById('status').className='mt-3 text-red-400';}}
async function createMission(){const type=prompt('Mission type:','environmental_scan');if(!type)return;const target=prompt('Target:','green-module');if(!target)return;const r=await fetch('/api/missions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,target,robot_id:'eva-ioni-001'})});if(r.ok)load();else alert('Mission error');}
load();setInterval(load,5000);
</script></body></html>
